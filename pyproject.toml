[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-profile"
version = "1.0.0"
description = "Profile wall time and process-tree memory for VEC local scoring commands."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vec-profile = "vec_profile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
